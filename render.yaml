services:
  - type: web
    name: crease
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crease-db
          property: connectionString

databases:
  - name: crease-db
    databaseName: crease
    user: crease
    plan: free
    region: singapore
    postgresMajorVersion: "16"
